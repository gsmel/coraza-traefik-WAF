# Simplified CRS Setup for Coraza
# Basic configuration without unsupported directives

# Set the default action for phase 1 and 2
SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"

# Engine configuration
SecRuleEngine On
SecAuditEngine RelevantOnly
SecRequestBodyAccess On
SecResponseBodyAccess Off

# Basic limits
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072

# Configure audit logging
SecAuditLog /dev/stdout
SecAuditLogType Serial

# Configure data paths
SecDataDir /tmp

# Basic paranoia level (1-4, 1 is least paranoid)
SecAction \
  "id:900000,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:'tx.paranoia_level=1',\
   setvar:'tx.crs_setup_version=400'"

# Set other required variables
SecAction \
  "id:900001,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:'tx.anomaly_score_threshold=5',\
   setvar:'tx.inbound_anomaly_score_threshold=5',\
   setvar:'tx.outbound_anomaly_score_threshold=4'"
