# Nginx Configuration for Coraza WAF Integration
# Add this to your nginx.conf or site configuration

upstream coraza_waf {
    server coraza-waf:9080;
}

server {
    listen 80;
    server_name myapp.example.com;

    # WAF authentication endpoint
    location = /auth {
        internal;
        proxy_pass http://coraza_waf;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    # Main application location
    location / {
        # Authenticate with Coraza WAF first
        auth_request /auth;
        
        # Forward to your application
        proxy_pass http://my-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Optional: Add security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
    }

    # Optional: Expose WAF metrics (restrict access as needed)
    location /waf-metrics {
        proxy_pass http://coraza_waf/metrics;
        # Restrict to internal networks only
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}

