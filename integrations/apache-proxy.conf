# Apache Configuration for Coraza WAF Integration
# Add this to your Apache virtual host configuration

<VirtualHost *:80>
    ServerName myapp.example.com
    
    # Define the WAF upstream
    ProxyPreserveHost On
    
    # WAF authentication - check all requests
    <Location />
        # Forward authentication to Coraza WAF
        AuthType None
        ProxyPass http://coraza-waf:9080/
        ProxyPassReverse http://coraza-waf:9080/
        
        # Set required headers for WAF
        ProxyPassRequestHeaders On
        ProxySet X-Forwarded-Proto "http"
        ProxySet X-Forwarded-Host "%{HTTP_HOST}"
        ProxySet X-Forwarded-For "%{REMOTE_ADDR}"
    </Location>
    
    # After WAF validation, proxy to your application
    <LocationMatch "^/(?!auth)">
        ProxyPass http://my-app:8080/
        ProxyPassReverse http://my-app:8080/
        
        # Security headers
        Header always set X-Frame-Options "DENY"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-XSS-Protection "1; mode=block"
    </LocationMatch>
    
    # Optional: WAF metrics endpoint (restrict access)
    <Location "/waf-metrics">
        ProxyPass http://coraza-waf:9080/metrics
        ProxyPassReverse http://coraza-waf:9080/metrics
        
        # Restrict to internal networks
        Require ip 10.0.0.0/8
        Require ip 172.16.0.0/12
        Require ip 192.168.0.0/16
    </Location>
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/waf_error.log
    CustomLog ${APACHE_LOG_DIR}/waf_access.log combined
</VirtualHost>

# Required Apache modules:
# a2enmod proxy
# a2enmod proxy_http
# a2enmod headers
# a2enmod rewrite

